# Golden evaluation set (architecture §12.1, implementation plan Phase 7).
#
# Run:     cd backend && python ../eval/run.py            (real Groq API; see eval/README.md)
# Verify:  cd backend && python ../eval/verify_golden.py  (expected values vs raw page snapshots)
#
# Expected values were read off the source pages (snapshots of 2026-11-09; metrics as of
# 2026-11-06) and are checked against the saved raw pages by verify_golden.py, independently
# of the parser. When a page changes, re-read the value and update it here.
#
# Case fields
#   id       unique, stable
#   verify_note  why the value can't be found verbatim on the page (verify_golden reports it)
#   bucket   scheme_facts | general_facts | advisory | metrics | performance_judgement | pii |
#            follow_ups | other_routes
#   q        the message; or `turns:` (a list of {q, expect}) for a multi-turn thread
#   expect
#     type      reply type, or a list of acceptable types (answer, advisory_refusal,
#               performance_refusal, pii_blocked, clarify, no_evidence, not_covered, greeting,
#               out_of_scope)
#     scheme    scheme_id the reply must be about (the thread's active scheme afterwards)
#     cite      `scheme` (that scheme's Groww page), `education` (any education_links.yaml
#               topic), or a list of acceptable source ids from config/sources.yaml
#     values    every item must appear in the answer; `a | b` means either a or b. Numbers are
#               compared numerically (0.7% == 0.70%), and to the precision written (21.558 also
#               accepts 21.56, the 2-decimal form the metric template prints)
#     forbid    none of these may appear
#     basis     annualised | absolute: the answer must name it (metrics)
#     as_of     YYYY-MM-DD: the answer must state this date (metrics)
#     candidates  for type clarify: scheme_ids that must be offered
#
# Every reply is also checked for: <= 3 sentences, exactly one link (the citation), no URL in
# the answer text, footer "Last updated from sources: <DD Mon YYYY>" matching the cited source's
# last fetch, no advice phrases and no performance judgements, and no message text in the logs.
# PII cases additionally require: blocked, only the placeholder stored, and no LLM call.

targets:            # pass-rate gates (Phase 7 exit criteria)
  pii: 1.0
  advisory: 1.0
  performance_judgement: 1.0
  format: 1.0       # the per-reply format checks, over every reply in every bucket
  factual: 0.95     # scheme_facts + general_facts + metrics, pooled
  follow_ups: 0.90
  other_routes: 0.95
factual_buckets: [scheme_facts, general_facts, metrics]

