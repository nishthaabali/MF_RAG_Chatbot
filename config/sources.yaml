# URL allowlist. No URL outside this file is ever fetched or cited.
#
# Fields
#   id          unique source id (also the data/raw/<id>/ folder name)
#   url         https URL
#   type        scheme_page | amfi | sebi | rta_help
#   render      static (httpx) | browser (Playwright). Groww pages are server-rendered (all facts
#               are in the embedded __NEXT_DATA__ JSON), so they are fetched as static HTML.
#   scheme_id   scheme_page only; links the page to config/aliases.yaml
#   amc         scheme_page only; AMC id from config/aliases.yaml `amcs`
#   name        scheme_page: scheme name as shown on the live page title (checked 2026-11-09)
#               other types: short description of what the page covers
#   category    scheme_page only
#
# NOTE: several Groww URL slugs are legacy names and now open a different scheme than the
# slug suggests (e.g. ".../birla-sun-life-short-term-fund-..." is the ABSL Corporate Bond
# Fund). `name` follows the live page, not the slug. See docs/corpus-review.md.

