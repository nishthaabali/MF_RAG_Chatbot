# Names users may type. Matching is case-insensitive and ignores punctuation.
#
# amcs     alias -> AMC id. Used to detect "the HDFC fund"; if an AMC has several covered
#          schemes the resolver asks a clarifying question, if it has one it resolves.
# schemes  scheme_id -> aliases. An alias must belong to exactly one scheme. Generic category
#          phrases ("large cap fund") are NOT aliases; the resolver handles those as ambiguity.
#
# Old names come from earlier Groww URL slugs and well-known renames. Do not add an alias for a
# scheme that is not in config/sources.yaml (e.g. "ABSL Short Term Fund" is a different, uncovered
# scheme today) - such names must fall through to "not in my sources".

amcs:
  hdfc:
    name: HDFC Mutual Fund
    aliases: [HDFC, HDFC AMC, HDFC Mutual Fund]
  absl:
    name: Aditya Birla Sun Life Mutual Fund
    aliases: [ABSL, ABSLMF, Aditya Birla, Aditya Birla Sun Life, Birla, Birla Sun Life]
  nippon:
    name: Nippon India Mutual Fund
    aliases: [Nippon, Nippon India, Reliance Mutual Fund]
  icici:
    name: ICICI Prudential Mutual Fund
    aliases: [ICICI, ICICI Pru, ICICI Prudential, Pru]
  ppfas:
    name: PPFAS Mutual Fund
    aliases: [PPFAS, Parag Parikh]
  bandhan:
    name: Bandhan Mutual Fund
    aliases: [Bandhan, IDFC Mutual Fund]
  kotak:
    name: Kotak Mutual Fund
    aliases: [Kotak, Kotak Mahindra]
  edelweiss:
    name: Edelweiss Mutual Fund
    aliases: [Edelweiss]

